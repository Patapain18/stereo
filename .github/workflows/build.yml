name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (Debug)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project Stereo.xcodeproj \
            -scheme Stereo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compute artefact size
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Stereo.app" -type d -path "*/Build/Products/Debug/*" 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Built app: $APP"
            du -sh "$APP"
          fi
