name: Stereo
options:
  bundleIdPrefix: com.mathis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Stereo:
    type: application
    platform: macOS
    sources:
      - path: Stereo
        excludes:
          - "Stereo.entitlements"
    info:
      path: Stereo/Info.plist
      properties:
        NSAppleEventsUsageDescription: "Stéréo a besoin de contrôler Apple Music pour synchroniser la cassette en temps réel."
        NSAppleMusicUsageDescription: "Stéréo a besoin de contrôler Apple Music pour synchroniser la cassette en temps réel."
        LSApplicationCategoryType: public.app-category.music
        CFBundleName: Stereo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ATSApplicationFontsPath: "."
    entitlements:
      path: Stereo/Stereo.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathis.Stereo
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
